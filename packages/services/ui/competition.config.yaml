with:
  - ../../packages/noop
  - ../../packages/standard
  - ../../packages/db/prisma
appName: GPPC
appDescription: GPPC is etc.etc.
auth:
  email:
    providerOptions: {}
    betterAuthOptions: {}
    signInParams: {}
    signOutParams: {}
    signUpParams: {}
  gitlab:
    providerOptions: {}
    betterAuthOptions: {}
    signInParams: {}
    signOutParams: {}
    signUpParams: {}
  github:
    providerOptions: {}
    betterAuthOptions: {}
    signInParams: {}
    signOutParams: {}
    signUpParams: {}
db:
  provider: postgresql
  url: postgres://postgres:postgres@localhost:5433/postgres

competitions:
  - id: "fit5047"
    with: []
    name: "FIT5047 Pacman Competition"
    organiser: "Monash University"
    description: >
      A programming competition for FIT5047 where participants build Pacman
      agents and compare their performance under a shared evaluation setup.
    tracks:
      - id: "main"
        name: "Main Track"
        description: >
          The standard competition track for submitting and evaluating your
          Pacman agent.
        with: []
        form:
          with: []
    runner:
      with: []
      body: |
        ({
          ok: true,
          track: submission.track,
          submission: JSON.parse(submission.body),
        })
    leaderboards: []
