services:
  db:
    image: postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
  ui:
    build:
      context: .
      dockerfile: dockerfile.services.ui
    ports:
      - "3007:80"
    depends_on:
      - db
    environment:
      BETTER_AUTH_SECRET: secret
    volumes:
      - ./competition.config.ts:/competition.config.ts
  base:
    build:
      context: .
      dockerfile: dockerfile.services.base
    depends_on:
      - db
    volumes:
      - ./competition.config.ts:/competition.config.ts
  basic-runner:
    build:
      context: .
      dockerfile: dockerfile.services.runners.basic-runner
    depends_on:
      - db
    volumes:
      - ./competition.config.ts:/competition.config.ts
