name: Publish Packages

on:
  # Tags, not branches. A push to main would republish versions that are already
  # on the registry, which npm rejects, so every merge would show up as a failed
  # release and the one time it mattered nobody would look.
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: publish-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The package list comes from list-packages.sh so that it cannot drift from
  # publish.sh. It used to be spelled out here, and four packages were missing.
  list-packages:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: List publishable packages
        id: list
        run: |
          echo "packages=$(./list-packages.sh | jq -Rsc 'split("\n") | map(select(length > 0))')" >> "${GITHUB_OUTPUT}"

  build-and-publish:
    needs: list-packages
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      packages: write

    strategy:
      # One at a time, in the order `list-packages.sh` printed them, which is
      # dependencies before dependents. `bun pm pack` rewrites `workspace:*` to an
      # exact version, so a dependent published before its dependency names a
      # version the registry does not have yet and is uninstallable from the
      # moment it lands. Running the matrix in parallel is what did that: it threw
      # away the ordering the list exists to provide, and shipped three leaderboard
      # renderers pinned to a `leaderboard-common` that was never published.
      max-parallel: 1
      # Ordered, so stopping on the first failure stops before anything that
      # depends on the package that failed. The opposite setting kept going and
      # published the dependents anyway.
      fail-fast: true
      matrix:
        path: ${{ fromJSON(needs.list-packages.outputs.packages) }}

    defaults:
      run:
        working-directory: ${{ matrix.path }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          registry-url: "https://registry.npmjs.org"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          registries: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install
      - name: Update dependencies
        run: bun update

      # `bun pm pack -quiet` fails outright — Invalid Argument '-q'. The flag is
      # --quiet, and without it the tarball path is buried in pack's output.
      - name: Publish package
        run: |
          DEST=$(bun pm pack --quiet)
          bunx npm publish "${DEST}" --provenance --access public
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
