name: Publish Packages

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: publish-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        package:
          - path: packages/core
          - path: packages/packages/db/prisma
          - path: packages/packages/form/json
          - path: packages/packages/integration/github-classic
          - path: packages/packages/leaderboard/ag-grid
          - path: packages/packages/noop
          - path: packages/packages/standard
          - path: packages/sdk

    defaults:
      run:
        working-directory: ${{ matrix.package.path }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
      - name: Update dependencies
        run: bun update

      - name: Publish package
        run: bun publish --registry https://npm.pkg.github.com/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_TOKEN: ${{ secrets.GITHUB_TOKEN }}
